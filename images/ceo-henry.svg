  <circle cx="150" cy="120" r="70" fill="#ffdbac" stroke="black" stroke-width="5"/>
  <!-- hard hat (safety first) -->
  <path d="M80 100 A70 70 0 0 1 220 100 Z" fill="yellow" stroke="black" stroke-width="5"/>
  <rect x="70" y="95" width="160" height="14" fill="yellow" stroke="black" stroke-width="4"/>
  <!-- face -->
  <circle cx="125" cy="125" r="8" fill="black"/>
  <circle cx="175" cy="125" r="8" fill="black"/>
