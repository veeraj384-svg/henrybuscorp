<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- sky (poorly chosen gradient) -->
  <rect width="640" height="400" fill="#00ffff"/>
  <rect y="300" width="640" height="100" fill="#7cfc00"/>
  <circle cx="70" cy="60" r="40" fill="yellow" stroke="orange" stroke-width="6"/>
  <text x="45" y="70" font-family="Comic Sans MS, cursive" font-size="20" fill="red">sun</text>

  <!-- clouds (grey rectangles because budget) -->
  <rect x="420" y="40" width="120" height="35" rx="18" fill="#dddddd"/>
  <rect x="180" y="90" width="90" height="28" rx="14" fill="#eeeeee"/>

  <!-- wind lines SLAMMING into the flat front -->
  <g stroke="#0000ff" stroke-width="5" fill="none">
    <path d="M10 160 L150 160"/>
    <path d="M10 200 L150 200"/>
    <path d="M10 240 L150 240"/>
    <path d="M150 160 L120 130"/>
    <path d="M150 200 L115 235"/>
    <path d="M150 240 L120 275"/>
  </g>
  <text x="12" y="140" font-family="Comic Sans MS, cursive" font-size="18" fill="blue" font-weight="bold">wind (loosing)</text>

  <!-- THE PLANE: a brick. completely flat front. -->
  <g>
    <!-- fuselage = brick -->
    <rect x="150" y="140" width="300" height="120" fill="#b22222" stroke="black" stroke-width="6"/>
    <!-- brick mortar lines, it is literally a brick -->
    <g stroke="black" stroke-width="3">
      <line x1="150" y1="180" x2="450" y2="180"/>
      <line x1="150" y1="220" x2="450" y2="220"/>
      <line x1="225" y1="140" x2="225" y2="180"/>
      <line x1="375" y1="140" x2="375" y2="180"/>
      <line x1="300" y1="180" x2="300" y2="220"/>
      <line x1="225" y1="220" x2="225" y2="260"/>
      <line x1="375" y1="220" x2="375" y2="260"/>
    </g>
    <!-- one (1) window -->
    <rect x="290" y="155" width="45" height="35" fill="#87cefa" stroke="black" stroke-width="4"/>
    <text x="293" y="180" font-family="Comic Sans MS, cursive" font-size="14">:(</text>
    <!-- wings: too small, upside down-ish -->
    <polygon points="270,140 330,140 300,90" fill="#808080" stroke="black" stroke-width="5"/>
    <polygon points="270,260 330,260 300,320" fill="#808080" stroke="black" stroke-width="5"/>
    <!-- tail on the FRONT for some reason -->
    <polygon points="150,140 150,80 200,140" fill="#ff8c00" stroke="black" stroke-width="5"/>
    <!-- engine held on with tape -->
    <ellipse cx="470" cy="200" rx="35" ry="28" fill="#c0c0c0" stroke="black" stroke-width="5"/>
    <rect x="440" y="185" width="20" height="30" fill="#ffff00" opacity="0.8"/>
    <text x="428" y="250" font-family="Comic Sans MS, cursive" font-size="14" fill="black">tape</text>
    <!-- smoke already -->
    <circle cx="530" cy="190" r="14" fill="#555555"/>
    <circle cx="560" cy="180" r="18" fill="#777777"/>
    <circle cx="595" cy="168" r="22" fill="#999999"/>
  </g>

  <!-- arrow pointing at brick -->
  <path d="M300 360 L300 300" stroke="red" stroke-width="8" fill="none"/>
  <polygon points="300,290 285,315 315,315" fill="red"/>
  <text x="130" y="390" font-family="Comic Sans MS, cursive" font-size="26" fill="red" font-weight="bold">the HB-1 "BrikJet" (actual foto)</text>
</svg>
