<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <rect width="640" height="420" fill="#ffff99"/>
  <text x="60" y="40" font-family="Comic Sans MS, cursive" font-size="28" fill="purple" font-weight="bold" text-decoration="underline">SCIENTIFIK AIR RESISTENCE DIAGRAM</text>

  <!-- normal plane (bad) -->
  <text x="40" y="100" font-family="Comic Sans MS, cursive" font-size="20" fill="black">other planes (aerodinamic = COWARDS):</text>
  <g>
    <ellipse cx="320" cy="150" rx="120" ry="30" fill="#dddddd" stroke="black" stroke-width="4"/>
    <polygon points="420,150 470,130 470,170" fill="#dddddd" stroke="black" stroke-width="4"/>
    <g stroke="#00aa00" stroke-width="4" fill="none">
      <path d="M100 135 C160 120, 200 118, 250 128"/>
      <path d="M100 165 C160 180, 200 182, 250 172"/>
    </g>
    <text x="470" y="120" font-family="Comic Sans MS, cursive" font-size="16" fill="#00aa00">air slips past. BOOORING</text>
  </g>

  <!-- our plane (worse) -->
  <text x="40" y="240" font-family="Comic Sans MS, cursive" font-size="20" fill="black">HENRYBUS plane (100% air resistent!!!):</text>
  <g>
    <rect x="260" y="270" width="180" height="90" fill="#b22222" stroke="black" stroke-width="5"/>
    <line x1="260" y1="300" x2="440" y2="300" stroke="black" stroke-width="3"/>
    <line x1="260" y1="330" x2="440" y2="330" stroke="black" stroke-width="3"/>
    <line x1="350" y1="270" x2="350" y2="300" stroke="black" stroke-width="3"/>
    <line x1="350" y1="330" x2="350" y2="360" stroke="black" stroke-width="3"/>
    <!-- air bouncing straight back off -->
    <g stroke="red" stroke-width="5" fill="none">
      <path d="M120 285 L255 285"/>
      <path d="M255 285 L180 250"/>
      <path d="M120 345 L255 345"/>
      <path d="M255 345 L180 385"/>
      <path d="M120 315 L255 315"/>
      <path d="M255 315 L140 315"/>
    </g>
    <text x="445" y="300" font-family="Comic Sans MS, cursive" font-size="16" fill="red">air BOUNCES OF.</text>
    <text x="445" y="322" font-family="Comic Sans MS, cursive" font-size="16" fill="red">air = DEFEETED</text>
    <text x="445" y="352" font-family="Comic Sans MS, cursive" font-size="16" fill="red">plane = also defeeted</text>
  </g>

  <text x="90" y="410" font-family="Comic Sans MS, cursive" font-size="18" fill="blue">fig 1. (drawed by are CEO's nephew, age 9, payed in gum)</text>
</svg>
